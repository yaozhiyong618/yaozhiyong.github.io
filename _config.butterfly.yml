    - 论道、学与政 | On Tao, Academics, and Governance

# 头像配置
avatar:
  img: /img/avatar.png
  effect: false

# 侧边栏与公告栏设置
aside:
  enable: true
  hide: false
  button: true
  card_author:
    enable: true
    description: 复旦大学管理学院教授、博导 | Professor at School of Management, Fudan University.
    avatar: /img/avatar.png
