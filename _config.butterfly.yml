  effect: true
  typed_option:
    typeSpeed: 50
    backSpeed: 30
    loop: true
  sub:
    - 复旦大学管理学院教授、博导 | Professor of Economics, Fudan University
    - 美国加州大学洛杉矶分校 (UCLA) 经济学博士 | Ph.D. in Economics, UCLA
